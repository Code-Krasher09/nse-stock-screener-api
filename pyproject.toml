[project]
name = "nse-stock-screener-api"
version = "0.1.0"
description = "FastAPI backend for real-time NSE stock screening"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "uvicorn",
    "sqlalchemy",
    "asyncpg",
    "redis",
    "apscheduler",
    "yfinance",
    "pandas",
    "numpy",
    "python-dotenv",
    "pydantic",
    "httpx",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "RUF", # ruff-specific
]
ignore = [
    "B008", # do not perform function calls in argument defaults (FastAPI Depends)
]
